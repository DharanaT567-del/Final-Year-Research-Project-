spring.application.name=apigateway
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/naada_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── AI Tutor (Spring AI + Gemini + Pinecone) ──────────────────
spring.ai.openai.api-key=${AI_API_KEY:${GEMINI_API_KEY:AQ.Ab8RN6L4v_-ZhV8Iq7uXxARxUhYE0UTC_o-v0BCfvtNTEyXJWw}}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=gemini-embedding-001

spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:pcsk_pb9V3_GnGtHJruZcpxAXv3uUrpjEYkKpwW3fkC8etfU1FJyJqCjbqNN2QCE5beBSoAprR}
spring.ai.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT:us-east-1}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:naada-music-index}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:_default_}


