<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182d"><title>Naada — Frontend Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#17213a;background:#f5f7fc;--navy:#10182d;--blue:#5c6fe8;--muted:#77819a;--border:#e5e9f2}*{box-sizing:border-box}body{margin:0}.top{height:68px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,5vw);position:sticky;top:0;z-index:3}.brand{border:0;background:none;display:flex;gap:10px;align-items:center;color:var(--navy);font-weight:800;font-size:23px}.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;color:white;background:linear-gradient(140deg,#5e72f3,#8b67e8)}.nav{display:flex;gap:8px}.nav button,.link{border:0;background:transparent;color:#68728b;font-weight:700;padding:10px;border-radius:9px}.nav button:hover{background:#f1f3fc}.wrap{width:min(970px,calc(100% - 30px));margin:auto;padding:28px 0 50px}.auth{min-height:calc(100vh - 130px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:55px}.eyebrow{color:#6574df;font-size:10px;font-weight:800;letter-spacing:1.5px}.hero h1,.intro h1{font:800 clamp(34px,4vw,52px)/1.14 Manrope,sans-serif;letter-spacing:-1.8px;color:var(--navy);margin:16px 0}.hero h1 span,.intro h1 span{color:#6979ed}.hero p,.intro p{color:var(--muted);font-size:13px;line-height:1.8}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.pills span{background:white;border:1px solid var(--border);border-radius:9px;padding:10px;font-size:10px;font-weight:700;color:#58647f}.card{background:white;border:1px solid var(--border);border-radius:20px;padding:clamp(22px,4vw,38px);box-shadow:0 15px 45px #1727470b}.card h2{font:800 25px Manrope;margin:0 0 7px}.muted{color:var(--muted)}.card>p{font-size:12px;margin-bottom:20px}.label{display:block;font-size:11px;font-weight:700;margin:15px 0 7px;color:#46516c}.field{width:100%;border:1px solid #e1e5f0;border-radius:10px;padding:14px;font-size:13px;outline:none}.field:focus{border-color:#7887ed}.primary,.secondary{border:0;border-radius:10px;padding:13px 16px;font-size:12px;font-weight:800;cursor:pointer}.primary{color:white;background:linear-gradient(115deg,#5269e7,#7968e8);box-shadow:0 6px 15px #6575e52b}.secondary{color:#58657f;background:white;border:1px solid #dfe3f0}.full{width:100%;margin-top:20px}.switch{text-align:center;font-size:11px;color:#77819a;margin-top:18px}.switch button{border:0;background:none;color:#586be1;font-weight:800}.hint,.notice{padding:12px;background:#f2f2ff;color:#696aa1;border-radius:9px;font-size:10px;line-height:1.5;margin-top:16px}.banner{background:linear-gradient(115deg,#111a32,#202e50 70%,#394677);color:white;border-radius:21px;padding:clamp(25px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px}.banner h1{font:800 clamp(32px,4vw,46px)/1.15 Manrope;margin:15px 0}.banner h1 span{color:#aab3ff}.banner p{font-size:12px;line-height:1.7;color:#c4cce0;max-width:440px}.disc{width:155px;height:155px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:repeating-radial-gradient(circle,#202b4b 0 5px,#39466b 6px 8px,#192443 9px 13px);box-shadow:0 0 0 16px #ffffff08}.disc div{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8a79f3,#5c7af3);font-size:26px}.section{font:800 20px Manrope;margin:28px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.feature{border:1px solid var(--border);border-radius:14px;padding:19px;background:white;text-align:left;cursor:pointer}.feature .symbol{display:grid;place-items:center;width:39px;height:39px;border-radius:11px;background:#eef0ff;color:#6675e6;font-size:20px}.feature h3{font:800 14px Manrope;margin:15px 0 7px}.feature p{font-size:11px;line-height:1.6;color:var(--muted)}.feature b{font-size:10px;color:#6574df}.intro{margin:24px 0}.intro h1{font-size:40px;margin:12px 0}.upload{background:white;border:1px solid var(--border);border-radius:17px;padding:clamp(18px,4vw,32px)}.upload h2{font:800 17px Manrope;margin:0 0 6px}.upload p{font-size:11px}.drop{margin-top:18px;min-height:130px;border:1.5px dashed #cdd4eb;border-radius:12px;background:#fafbff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:15px;color:#6574df;font-size:12px;cursor:pointer}.drop input{max-width:100%;font-size:10px}.langhead{display:flex;justify-content:space-between;margin:25px 0 10px;font-size:12px;font-weight:800}.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lang{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:white;border-radius:10px;padding:12px;text-align:left;cursor:pointer}.lang.active{border-color:#8994ef;background:#f8f8ff}.lang .tick{width:17px;height:17px;border:1px solid #ccd2e4;border-radius:5px;display:grid;place-items:center;color:white;font-size:11px}.lang.active .tick{background:#6575e8;border-color:#6575e8}.lang b,.lang small{display:block}.lang b{font-size:11px}.lang small{font-size:9px;color:var(--muted);margin-top:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.tabs{display:flex;gap:4px;background:#e9ecf6;padding:4px;border-radius:9px}.tabs button{border:0;background:transparent;border-radius:7px;padding:10px 12px;color:#78829a;font-size:10px;font-weight:800}.tabs button.active{background:white;color:#4d5fce}.line{background:white;border:1px solid var(--border);border-radius:13px;padding:17px;margin-bottom:11px;display:grid;grid-template-columns:30px 1fr;gap:12px}.num{background:#eef0ff;color:#6777e6;border-radius:8px;width:29px;height:29px;display:grid;place-items:center;font-size:10px;font-weight:800}.cap{font-size:8px;letter-spacing:1px;font-weight:800;color:#929bb0}.si{font-family:'Noto Sans Sinhala',sans-serif;font-size:14px;line-height:1.9;margin:7px 0 13px;overflow-wrap:anywhere}.simple{color:#5365d4}.trans{background:#f7f8fc;border-radius:8px;padding:11px;font-size:11px;line-height:1.7;color:#485570}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:10px}.word{background:white;border:1px solid var(--border);border-radius:12px;padding:16px}.word h3{font-family:'Noto Sans Sinhala',sans-serif;font-size:16px}.word p{font-size:11px;line-height:1.6;color:var(--muted)}.bottom-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.footer{border-top:1px solid var(--border);padding:17px;text-align:center;color:#98a0b3;font-size:9px}.hidden{display:none!important}
@media(max-width:680px){.top{height:60px;padding:0 13px}.brand{font-size:21px}.mark{width:34px;height:34px}.nav button{font-size:10px;padding:8px 5px}.wrap{padding:20px 0 35px}.auth{display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:calc(100vh - 105px);align-items:stretch}.hero h1{font-size:34px;margin:12px 0}.hero p{margin:0}.pills{margin-top:13px}.pills span{padding:7px;font-size:9px}.card{padding:22px;border-radius:16px}.card h2{font-size:22px}.banner{padding:23px 19px;border-radius:17px;min-height:0}.banner h1{font-size:32px;letter-spacing:-1.2px}.banner p{font-size:10px}.disc{width:82px;height:82px;box-shadow:0 0 0 8px #ffffff08}.disc div{width:39px;height:39px;font-size:19px}.grid{grid-template-columns:1fr}.feature{display:grid;grid-template-columns:40px 1fr;gap:0 11px;padding:14px}.feature .symbol{grid-row:span 3}.feature h3{margin:2px 0 5px}.feature p{margin:0 0 8px}.intro h1{font-size:34px}.upload{padding:17px}.langs{gap:7px}.lang{padding:9px;gap:7px}.lang small{font-size:8px}.toolbar{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tabs button{flex:1;padding:10px 5px}.vocab{grid-template-columns:1fr}.bottom-actions{flex-direction:column}.bottom-actions button{width:100%}.si{font-size:13px}.line{padding:13px 10px;gap:8px}}
</style></head>
<body><header class="top"><button class="brand" onclick="go('home')"><span class="mark">♫</span><span>naada</span></button><nav class="nav"><button onclick="go('home')">Home</button><button onclick="go('processing')">Lyrics Lab</button><button id="authnav" onclick="go('signup')">Sign up</button></nav></header><main id="app"></main><footer class="footer">naada · Frontend preview only — not connected to Firebase or the trained NLP model</footer>
<script>
const data=[
{orig:'හඳ එළිය මාවත පුරා පැතිරෙයි',simple:'හඳේ ආලෝකය පාර පුරා පැතිරෙනවා',en:'Moonlight spreads across the road.',ta:'நிலவொளி சாலை முழுவதும் பரவுகிறது.',words:[['හඳ එළිය','Moonlight — light coming from the moon.'],['පැතිරෙයි','Spreads or extends over an area.']]},
{orig:'නිහඬ රැයේ සිත මතක අතර සැරිසරයි',simple:'නිශ්ශබ්ද රාත්‍රියේ මට පරණ දේවල් මතක් වෙනවා',en:'In the quiet night, my mind wanders through memories.',ta:'அமைதியான இரவில், என் மனம் நினைவுகளில் அலைகிறது.',words:[['නිහඬ','Quiet, with little or no sound.'],['සැරිසරයි','Wanders or moves from place to place.']]},
{orig:'දුර අහසේ තරු සිහින කියා දෙයි',simple:'දුර අහසේ තරු මට සිහින මතක් කරනවා',en:'Stars in the distant sky remind me of dreams.',ta:'தொலைதூர வானில் உள்ள நட்சத்திரங்கள் கனவுகளை நினைவூட்டுகின்றன.',words:[['තරු','Stars — bright objects seen in the night sky.'],['සිහින','Dreams or hopes.']]}];
let screen='login',lang='English',tab='lines',selected=['English','Tamil'],fileName='';
function go(s){screen=s;render();window.scrollTo(0,0)}
function signIn(e){e.preventDefault();alert('Preview only: Firebase authentication is not connected.');go('home')}
function startDemo(){fileName=fileName||'Synthetic Sinhala lyric sample';go('results')}
function render(){
const app=document.getElementById('app');document.getElementById('authnav').textContent=(screen==='login'?'Sign up':screen==='signup'?'Sign in':'Sign out');document.getElementById('authnav').onclick=()=>go(screen==='login'?'signup':screen==='signup'?'login':'login');
if(screen==='login'||screen==='signup'){let signup=screen==='signup';app.innerHTML=`<div class="wrap auth"><section class="hero"><div class="eyebrow">✦ YOUR SONG. YOUR LANGUAGE.</div><h1>${signup?'Learn a language':'Feel the music.'}<br><span>${signup?'one song at a time.':'Understand every word.'}</span></h1><p>Explore Sinhala lyrics, discover new vocabulary, and learn through the songs you love.</p><div class="pills"><span>♬ Multilingual learning</span><span>▤ Simple explanations</span></div></section><section class="card"><h2>${signup?'Create account':'Sign in to Naada'}</h2><p class="muted">${signup?'Start your language-learning journey.':'Continue your language-learning journey.'}</p><form onsubmit="signIn(event)">${signup?'<label class="label">Full name</label><input class="field" placeholder="Your name" required>':''}<label class="label">Email address</label><input class="field" type="email" placeholder="you@example.com" required><label class="label">Password</label><input class="field" type="password" placeholder="${signup?'Create a password':'Enter your password'}" minlength="4" required><button class="primary full" type="submit">${signup?'Create account →':'Sign in →'}</button></form><div class="switch">${signup?'Already have an account?':'New to Naada?'} <button onclick="go('${signup?'login':'signup'}')">${signup?'Sign in':'Create an account'}</button></div><div class="hint">✦ Preview mode: forms are simulated. No account is created or authenticated.</div></section></div>`;return}
if(screen==='home'){app.innerHTML=`<div class="wrap"><section class="banner"><div><div class="eyebrow" style="color:#b5bdff">✦ YOUR PERSONAL LYRICS STUDIO</div><h1>Music makes language<br><span>come alive.</span></h1><p>Explore lyrics, make meaning clearer, and learn new words as you listen.</p><button class="primary" onclick="go('processing')">Explore lyrics →</button></div><div class="disc"><div>♫</div></div></section><h2 class="section">Your learning space</h2><div class="grid"><button class="feature" onclick="go('processing')"><span class="symbol">♫</span><h3>Understand lyrics</h3><p>Explore Sinhala lyrics with simpler explanations and translations.</p><b>Open Lyrics Lab →</b></button><button class="feature" onclick="tab='vocab';startDemo()"><span class="symbol">▤</span><h3>Build vocabulary</h3><p>Review useful words and meanings from the sample lyrics.</p><b>View sample words →</b></button><button class="feature" onclick="alert('Frontend preview only. No progress is saved.')"><span class="symbol">文</span><h3>Learn your way</h3><p>Switch between English and Tamil translations in the demo.</p><b>Explore languages →</b></button></div><div class="notice">✦ Synthetic sample content only — not output from the trained NLP model.</div></div>`;return}
if(screen==='processing'){app.innerHTML=`<div class="wrap"><button class="link" onclick="go('home')">← Back to Home</button><section class="intro"><div class="eyebrow">LYRICS LAB</div><h1>Make lyrics <span>make sense.</span></h1><p>Start with a sample or choose an audio file to preview the interface.</p></section><section class="upload"><h2>Choose your audio</h2><p class="muted">This web preview demonstrates the interface only.</p><label class="drop">♬<b>Choose an audio file</b><span>Tap to browse files on this device</span><input type="file" accept="audio/*" onchange="fileName=this.files[0]?.name||'';document.getElementById('fname').textContent=fileName||'No file selected'"></label><div id="fname" class="muted" style="font-size:10px;margin-top:7px">${fileName||'No file selected'}</div><div class="langhead"><span>Translation languages</span><span>${selected.length} selected</span></div><div class="langs">${['English','Tamil'].map(x=>`<button class="lang ${selected.includes(x)?'active':''}" onclick="toggleLang('${x}')"><span class="tick">${selected.includes(x)?'✓':''}</span><span><b>${x}</b><small>${x==='English'?'English translation':'தமிழ் மொழிபெயர்ப்பு'}</small></span></button>`).join('')}</div><button class="primary full" onclick="startDemo()">✦ Preview sample results →</button><p class="muted" style="text-align:center;font-size:9px;margin-top:13px">Audio is not uploaded or processed in this preview.</p></section></div>`;return}
if(screen==='results'){app.innerHTML=`<div class="wrap"><button class="link" onclick="go('processing')">← Back to Lyrics Lab</button><section class="intro"><div class="eyebrow">✦ YOUR LYRICS BREAKDOWN</div><h1>Understand the <span>meaning.</span></h1><p>${fileName} · Preview results</p></section><div class="notice">These are synthetic example results for checking the frontend. They were not generated by your trained NLP model.</div><div class="toolbar"><div class="tabs"><button class="${tab==='lines'?'active':''}" onclick="tab='lines';render()">Line comparison</button><button class="${tab==='vocab'?'active':''}" onclick="tab='vocab';render()">Vocabulary</button></div><span class="muted" style="font-size:10px">3 sample lines</span></div>${tab==='lines'?data.map((x,i)=>`<article class="line"><div class="num">0${i+1}</div><div><div class="cap">ORIGINAL SINHALA</div><p class="si">${x.orig}</p><div class="cap" style="color:#6878df">SIMPLIFIED SINHALA</div><p class="si simple">${x.simple}</p><div class="trans"><b>${lang} translation</b><br>${lang==='English'?x.en:x.ta}</div></div></article>`).join(''):`<div class="vocab">${data.flatMap(x=>x.words).map(w=>`<article class="word"><div>▤</div><h3>${w[0]}</h3><p>${w[1]}</p><span class="cap">SAMPLE EXPLANATION</span></article>`).join('')}</div>`}<div class="bottom-actions"><button class="secondary" onclick="lang=lang==='English'?'Tamil':'English';render()">Switch to ${lang==='English'?'Tamil':'English'}</button><button class="primary" onclick="go('processing')">Try another sample →</button></div></div>`;return}
}
function toggleLang(x){selected=selected.includes(x)?selected.filter(y=>y!==x):[...selected,x];render()}
render();
</script></body></html>
